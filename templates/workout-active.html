<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Workout</title>
    <link href="/style.css" rel="stylesheet" />
  </head>
  <body>
    {{template "navbar" .}}
    <h1>Active Workout</h1>

    <form action="/workout-active" method="post">
      <ul>
        {{range $exerciseIndex, $exercise := .}}
        <li>
          {{$exercise.Lift}}
          <ul>
            {{range $setIndex, $set := $exercise.Sets}}
            <li>
              <label>
                Weight
                <input type="number"
                       name="weight_{{$exerciseIndex}}_{{$setIndex}}"
                       value="{{$set.Weight}}" min="0" required>
              </label>
              <label>
                Reps
                <input type="number"
                       name="reps_{{$exerciseIndex}}_{{$setIndex}}"
                       value="{{$set.Reps}}" min="0" required>
              </label>
              <label>
                Completed
                <input type="checkbox"
                       name="completed_{{$exerciseIndex}}_{{$setIndex}}">
              </label>
          </li>
          {{end}}
          </ul>
        </li>
        {{else}}
        <li>No exercises yet. <a href="/workout-new">Add some here</a>.</li>
        {{end}}
      </ul>

      {{if .}}
      <hr/>
      <button type="submit" class = "button">Finish Workout</button>
      {{end}}
    </form>
  </body>
</html>
